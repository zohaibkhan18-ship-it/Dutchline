<!DOCTYPE html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dutchline Dairies</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--o:#F29128;--od:#D9761A;--ol:#FEF3E7;--b:#6B9AC8;--bd:#4F7FAE;--bl:#EEF4FA;--br:#795447;--ink:#2B211C;--mut:#8C7A70;--line:#EFE7E1}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Noto Nastaliq Urdu',Roboto,Arial,sans-serif;line-height:1.85;background:#F7F5F3;color:var(--ink)}
  .lat{font-family:Roboto,Arial,sans-serif}
  header{position:sticky;top:0;z-index:2;background:#fff;padding:max(10px,env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hrow img{height:34px}
  .who{font-family:Roboto,Arial,sans-serif;font-size:14px;font-weight:600;color:var(--br);text-align:left;direction:ltr;line-height:1.3}
  .who small{display:block;font-weight:400;color:var(--mut);font-size:12px}
  .hbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px;font-size:13px;color:var(--mut)}
  .icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
  .icon-btn svg{width:18px;height:18px;stroke:var(--br)}
  .bar{height:4px;background:var(--line);margin:0 -16px}
  .bar i{display:block;height:100%;background:var(--o);width:0;transition:width .3s}
  .wrap{padding:14px}
  .filter{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
  .filter button{flex:1;height:36px;border:0;background:transparent;border-radius:9px;color:var(--mut);font-family:inherit;font-size:14px}
  .filter button.on{background:var(--o);color:#fff;font-weight:600}
  .card{background:#fff;border-radius:16px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(43,33,28,.06),0 4px 14px rgba(43,33,28,.05);position:relative}
  .card.wait{opacity:.85}
  .top{display:flex;align-items:center;gap:10px}
  .badge{min-width:30px;height:30px;border-radius:50%;background:var(--ol);color:var(--od);font:600 14px Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  .card.done .badge{background:var(--o);color:#fff}
  .card.absent .badge{background:#ECE7E3;color:var(--mut)}
  .nm{font:600 16px Roboto,Arial,sans-serif;flex:1;line-height:1.3}
  .code{font:12px Roboto,Arial,sans-serif;color:var(--mut)}
  .addr{font:13px Roboto,Arial,sans-serif;color:var(--mut);margin:6px 40px 10px 0;line-height:1.4}
  .acts{display:flex;gap:8px;margin-bottom:10px}
  .pill{flex:1;height:40px;border-radius:12px;background:var(--bl);color:var(--bd);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600}
  .pill svg{width:18px;height:18px;stroke:var(--bd)}
  .pill.off{opacity:.35;pointer-events:none}
  .row{display:flex;gap:8px;align-items:center}
  .qty{direction:ltr;display:flex;align-items:center;background:#F7F5F3;border-radius:12px}
  .qty button{width:40px;height:46px;border:0;background:transparent;color:var(--od);font-size:22px}
  .qty input{width:52px;height:46px;border:0;background:transparent;text-align:center;font:600 18px Roboto,Arial,sans-serif;color:var(--ink)}
  .qty .u{font:12px Roboto,Arial,sans-serif;color:var(--mut);margin-right:2px}
  .btn{font-family:inherit;height:46px;border:0;border-radius:12px;padding:0 14px;font-size:15px;font-weight:600}
  .ok{background:var(--o);color:#fff;flex:1;box-shadow:0 3px 10px rgba(242,145,40,.35)} .ok:active{background:var(--od)}
  .more{display:flex;gap:6px;margin-top:8px}
  .chip{height:34px;border-radius:17px;border:1px solid var(--line);background:#fff;color:var(--br);font-family:inherit;font-size:13px;padding:0 12px}
  .status{position:absolute;top:12px;left:12px;font-size:12px;font-weight:600;padding:0 10px;border-radius:12px;line-height:24px}
  .status.g{background:var(--ol);color:var(--od)} .status.o{background:#ECE7E3;color:var(--mut)} .status.w{background:var(--bl);color:var(--bd)}
  .login{max-width:380px;margin:0 auto;padding:0 22px 30px}
  .brand{text-align:center;padding:max(46px,env(safe-area-inset-top)) 20px 26px}
  .brand img{width:min(78vw,300px)}
  .brand p{margin:8px 0 0;color:var(--mut);font-size:15px}
  .login label{font-size:14px;color:var(--br)}
  .login select,.login input{width:100%;height:50px;font:16px Roboto,Arial,sans-serif;margin:6px 0 16px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff}
  .login select:focus,.login input:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px var(--ol)}
  .login .btn{width:100%;background:var(--o);color:#fff;font-size:17px;height:52px;box-shadow:0 3px 10px rgba(242,145,40,.35)}
  .err{color:#C62828;font-size:14px;min-height:20px;margin-bottom:6px}
  .empty{text-align:center;color:var(--mut);padding:30px 10px}
</style></head>
<body>
<div id="app"><div class="login">لوڈ ہو رہا ہے…</div></div>
<script>
var S = {name:'', pin:'', today:'', stops:[], filter:'todo'};
var Q = JSON.parse(localStorage.getItem('dd_queue') || '[]');
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var API = 'https://script.google.com/macros/s/AKfycbyzcRip7H28PEpD1ydWdPA8v1YK0zRVYtMl2FsXJ2WSpH1mVjCgFaRLPwFsnife0p3d/exec';
var ACT = {appDrivers:'drivers', appLogin:'login', appSave:'save'};
function run(fn,args,ok,bad){
  bad = bad || function(e){ alert(e.message||e); };
  var b = {action: ACT[fn]};
  if (fn==='appLogin' || fn==='appSave') { b.name=args[0]; b.pin=args[1]; }
  if (fn==='appSave') b.rec=args[2];
  fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(b)})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j.ok) ok(j.data); else bad({message:j.error||'ERROR'}); })
    .catch(function(){ bad({message:'NET'}); });
}

function start(){
  var saved = JSON.parse(localStorage.getItem('dd_login') || 'null');
  if (saved) { S.name = saved.name; S.pin = saved.pin; load(); return; }
  run('appDrivers', [], showLogin, function(){ $('app').innerHTML='<div class="login">انٹرنیٹ نہیں ہے۔ <button class="btn mo" onclick="location.reload()">دوبارہ کوشش</button></div>'; });
}
function showLogin(names, msg){
  var o = (names||[]).map(function(n){return '<option>'+esc(n)+'</option>';}).join('');
  $('app').innerHTML = '<div class="brand"><img src="logo-full.png" alt="Dutchline Dairies"><p>ڈرائیور ایپ</p></div><div class="login">'+
    '<label>ڈرائیور</label><select id="nm">'+o+'</select><label>پن کوڈ</label>'+
    '<input id="pin" type="password" inputmode="numeric" maxlength="8">'+
    '<div class="err" id="err">'+esc(msg||'')+'</div><button class="btn" onclick="doLogin()">شروع کریں</button></div>';
}
function doLogin(){
  S.name = $('nm').value; S.pin = $('pin').value; $('err').textContent='چیک ہو رہا ہے…';
  run('appLogin',[S.name,S.pin],function(r){ localStorage.setItem('dd_login', JSON.stringify({name:S.name,pin:S.pin})); got(r); },
      function(e){ var m=e.message||''; $('err').textContent = m.indexOf('LOCKED')>=0 ? 'بہت زیادہ غلط کوششیں۔ 15 منٹ بعد دوبارہ کریں۔' : (m.indexOf('PIN')>=0 ? 'نام یا پن کوڈ غلط ہے' : 'انٹرنیٹ نہیں ہے'); });
}
function logout(){ localStorage.removeItem('dd_login'); location.reload(); }
function load(){
  run('appLogin',[S.name,S.pin],got,function(e){
    if ((e.message||'').indexOf('PIN')>=0) { localStorage.removeItem('dd_login'); run('appDrivers',[],function(n){showLogin(n,'دوبارہ لاگ اِن کریں');}); }
    else { var c = JSON.parse(localStorage.getItem('dd_route')||'null'); if (c) { got(c, true); } else $('app').innerHTML='<div class="login">انٹرنیٹ نہیں ہے۔ <button class="btn mo" onclick="location.reload()">دوبارہ کوشش</button></div>'; }
  });
}
function got(r, offline){
  S.today = r.today; S.stops = r.stops;
  localStorage.setItem('dd_route', JSON.stringify(r));
  Q.forEach(function(q){ var s = find(q.id); if (s && q.date===S.today) mark(s,q,true); });
  render(offline); flush();
}
function find(id){ for (var i=0;i<S.stops.length;i++) if (String(S.stops[i].id)===String(id)) return S.stops[i]; }
function mark(s,q,waiting){
  s.today = s.today || {status:'',litres:0,extra:0};
  if (q.status==='Extra') s.today.extra += Number(q.litres); else { s.today.status=q.status; s.today.litres=Number(q.litres); }
  s.wait = waiting;
}
function render(offline){
  var done=0; S.stops.forEach(function(s){ if (s.today && s.today.status) done++; });
  var list = S.stops.filter(function(s){ var d = s.today && s.today.status; return S.filter==='all' || (S.filter==='todo' ? !d : d); });
  var d = S.today.split('-');
  var h = '<header><div class="hrow"><img src="logo-wordmark.png" alt="Dutchline Dairies">'+
    '<div class="who">'+esc(S.name)+'<small>'+d[2]+'/'+d[1]+'/'+d[0]+'</small></div></div>'+
    '<div class="hbar"><span>'+S.stops.length+' میں سے '+done+' مکمل'+(Q.length?' · '+Q.length+' بھیجنا باقی':'')+(offline?' · آف لائن':'')+'</span>'+
    '<span><button class="icon-btn" onclick="load()" aria-label="refresh"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button><button class="icon-btn" onclick="logout()" aria-label="logout"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button></span></div>'+
    '<div class="bar"><i style="width:'+(S.stops.length?Math.round(done*100/S.stops.length):0)+'%"></i></div></header><div class="wrap">'+
    '<div class="filter">'+['todo','done','all'].map(function(f){return '<button class="'+(S.filter===f?'on':'')+'" onclick="S.filter=\''+f+'\';render()">'+{todo:'باقی',done:'مکمل',all:'سب'}[f]+'</button>';}).join('')+'</div>';
  if (!S.stops.length) h += '<div class="empty">آپ کے روٹ پر ابھی کوئی گاہک نہیں۔ دفتر سے رابطہ کریں۔</div>';
  else if (!list.length) h += '<div class="empty">'+(S.filter==='todo'?'سب مکمل ✓':'ابھی کچھ نہیں')+'</div>';
  list.forEach(function(s){
    var t = s.today, cls = s.wait ? 'wait' : (t && t.status==='Absent' ? 'absent' : (t && t.status ? 'done' : ''));
    var where = s.map || s.address, id = esc(s.id);
    var st = '';
    if (t && t.status) st = '<div class="status '+(s.wait?'w':(t.status==='Absent'?'o':'g'))+'">'+(s.wait?'بھیجا جا رہا ہے':(t.status==='Absent'?'غیر حاضر':'<span class="lat" dir="ltr">✓ '+t.litres+' L</span>'))+(t.extra?' +'+t.extra:'')+'</div>';
    var q = t && t.status==='Delivered' ? t.litres : s.usual;
    h += '<div class="card '+cls+'">'+st+'<div class="top"><div class="badge">'+(s.stop<9999?s.stop:'–')+'</div><div class="nm">'+esc(s.name)+'</div></div>'+
      '<div class="addr">'+(s.address?esc(s.address)+' · ':'')+'<span class="code">#'+id+'</span></div>'+
      '<div class="acts"><a class="pill'+(where?'':' off')+'" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(where||'')+'" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg> راستہ</a>'+
      '<a class="pill'+(s.phone?'':' off')+'" href="tel:'+esc(s.phone||'')+'"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg> کال</a></div>'+
      '<div class="row"><div class="qty"><button onclick="step(\''+id+'\',-0.5)">−</button><input id="q'+id+'" type="number" step="0.5" min="0" inputmode="decimal" value="'+q+'"><span class="u">L</span><button onclick="step(\''+id+'\',0.5)">+</button></div>'+
      '<button class="btn ok" onclick="save(\''+id+'\',\'Delivered\')">دے دیا</button></div>'+
      '<div class="more"><button class="chip" onclick="save(\''+id+'\',\'Absent\')">غیر حاضر</button>'+
      '<button class="chip" onclick="extra(\''+id+'\')">+ اضافی دودھ</button><button class="chip" onclick="note(\''+id+'\')">نوٹ</button></div></div>';
  });
  $('app').innerHTML = h + '</div>';
}
function step(id,d){ var i=$('q'+id); i.value = Math.max(0, (Number(i.value)||0)+d); }
function extra(id){ var l = prompt('اضافی دودھ کتنے لیٹر دیا؟','0.5'); if (l && Number(l)>0) save(id,'Extra',Number(l)); }
function note(id){ var n = prompt('دفتر کے لیے نوٹ:'); if (n) save(id,'Note',0,n); }
function gps(cb){
  if (!navigator.geolocation) return cb('');
  var done=false; setTimeout(function(){ if(!done){done=true;cb('');} }, 6000);
  navigator.geolocation.getCurrentPosition(function(p){ if(!done){done=true;cb(p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6));} },
    function(){ if(!done){done=true;cb('');} }, {enableHighAccuracy:true,timeout:5000,maximumAge:60000});
}
function save(id,status,litres,noteText){
  var s = find(id); if (!s) return;
  if (status==='Note') { status = (s.today && s.today.status) || 'Delivered'; litres = s.today && s.today.status ? s.today.litres : Number($('q'+id).value)||0; }
  if (status==='Delivered' && litres===undefined) litres = Number($('q'+id).value)||0;
  if (status==='Absent') litres = 0;
  var now = new Date(), hh=('0'+now.getHours()).slice(-2), mm=('0'+now.getMinutes()).slice(-2);
  gps(function(g){
    var rec = {id:id, status:status, litres:litres, note:noteText||'', gps:g, date:S.today, time:hh+':'+mm, key:Date.now()+'-'+id};
    Q.push(rec); localStorage.setItem('dd_queue', JSON.stringify(Q));
    mark(s,rec,true); render(); flush();
  });
}
var busy=false;
function flush(){
  if (busy || !Q.length) return; busy=true;
  var rec = Q[0];
  run('appSave',[S.name,S.pin,rec],function(){
    Q.shift(); localStorage.setItem('dd_queue', JSON.stringify(Q)); busy=false;
    var s=find(rec.id); if (s && !Q.some(function(q){return q.id===rec.id;})) s.wait=false;
    render(); flush();
  }, function(e){ busy=false; if ((e.message||'').indexOf('PIN')>=0) { alert('آپ کا پن کوڈ بدل گیا ہے۔ دوبارہ لاگ اِن کریں۔'); logout(); } });
}
setInterval(flush, 20000); window.addEventListener('online', flush);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
start();
</script></body></html>
